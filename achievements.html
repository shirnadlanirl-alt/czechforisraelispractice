<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Czech Academy | הישגים</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }

    header {
      background: #fff;
      border-bottom: 2px solid #e8f5e9;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header a { text-decoration: none; color: #2e7d32; font-size: 20px; }
    header h1 { font-size: 20px; font-weight: 700; }

    .container { max-width: 700px; margin: 0 auto; padding: 32px 20px; }

    .progress-bar-wrap {
      background: #fff;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .progress-bar-wrap .label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .bar-bg { background: #e0e0e0; border-radius: 8px; height: 12px; }
    .bar-fill { background: linear-gradient(90deg, #2e7d32, #66bb6a); border-radius: 8px; height: 12px; transition: width 0.6s; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .badge-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s;
      position: relative;
      overflow: hidden;
    }
    .badge-card:hover { transform: translateY(-2px); }

    .badge-card.locked {
      opacity: 0.45;
      filter: grayscale(1);
    }

    .badge-card .icon { font-size: 40px; margin-bottom: 10px; }
    .badge-card .name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .badge-card .desc { font-size: 12px; color: #888; line-height: 1.4; }
    .badge-card .date { font-size: 11px; color: #2e7d32; margin-top: 8px; font-weight: 600; }

    .badge-card.unlocked::after {
      content: '✓';
      position: absolute;
      top: 10px;
      left: 10px;
      background: #2e7d32;
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1a1a2e;
    }

    .xp-total {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      color: #2e7d32;
      margin-bottom: 4px;
    }
    .xp-label { text-align: center; color: #888; font-size: 13px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">←</a>
    <h1>🏅 הישגים</h1>
  </header>

  <div class="container">
    <div class="xp-total" id="xpTotal">0 XP</div>
    <div class="xp-label">נקודות ניסיון שנצברו</div>

    <div class="progress-bar-wrap">
      <div class="label">
        <span id="unlockedLabel">0 הישגים פתוחים</span>
        <span id="totalLabel">מתוך 0</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id
