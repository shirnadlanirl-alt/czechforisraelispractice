<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Czech Academy | חזרות</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }

    header {
      background: #fff;
      border-bottom: 2px solid #e8f5e9;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header a { text-decoration: none; color: #2e7d32; font-size: 20px; }
    header h1 { font-size: 20px; font-weight: 700; color: #1a1a2e; }

    .container { max-width: 700px; margin: 0 auto; padding: 32px 20px; }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card .num { font-size: 36px; font-weight: 800; color: #2e7d32; }
    .card .lbl { font-size: 13px; color: #666; margin-top: 4px; }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 16px; }

    .review-list { display: flex; flex-direction: column; gap: 12px; }

    .review-item {
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border-right: 4px solid #ef5350;
    }
    .review-item.medium { border-right-color: #ff9800; }
    .review-item.low { border-right-color: #fdd835; }

    .item-info .word { font-size: 18px; font-weight: 700; }
    .item-info .translation { font-size: 14px; color: #666; margin-top: 2px; }
    .item-info .meta { font-size: 12px; color: #aaa; margin-top: 4px; }

    .item-badge {
      background: #fce4e4;
      color: #c62828;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .item-badge.medium { background: #fff3e0; color: #e65100; }

    .start-btn {
      display: block;
      width: 100%;
      background: #2e7d32;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      padding: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 24px;
      transition: background 0.2s;
    }
    .start-btn:hover { background: #1b5e20; }
    .start-btn:disabled { background: #ccc; cursor: default; }

    .lesson-chip {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">←</a>
    <h1>🔄 חזרות</h1>
  </header>

  <div class="container">
    <div class="summary-cards">
      <div class="card">
        <div class="num" id="reviewCount">0</div>
        <div class="lbl">לחזרה עכשיו</div>
      </div>
      <div class="card">
        <div class="num" id="weakCount">0</div>
        <div class="lbl">פריטים חלשים</div>
      </div>
      <div class="card">
        <div class="num" id="totalSeen">0</div>
        <div class="lbl">פריטים שנלמדו</div>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startReview()">התחילי חזרה עכשיו</button>

    <div class="section-title">פריטים שדורשים חזרה</div>
    <div class="review-list" id="reviewList"></div>
  </div>

  <script src="app-state.js"></script>
  <script>
    function init() {
      const overview = CzechAppState.getOverview();
      const queue = CzechAppState.getReviewQueue();
      const state = CzechAppState.getState();
      const totalSeen = Object.keys(state.questionStats).length;

      document.getElementById('reviewCount').textContent = queue.length;
      document.getElementById('weakCount').textContent = overview.hardCount;
      document.getElementById('totalSeen').textContent = totalSeen;

      const btn = document.getElementById('startBtn');
      if (queue.length === 0) btn.disabled = true;

      renderList(queue);
    }

    function renderList(queue) {
      const el = document.getElementById('reviewList');
      if (queue.length === 0) {
        el.innerHTML = `
          <div class="empty-state">
            <div class="icon">🎉</div>
            <p>אין פריטים לחזרה כרגע.<br>תמשיכי ללמוד שיעורים חדשים!</p>
          </div>`;
        return;
      }

      el.innerHTML = queue.slice(0, 20).map(q => {
        const total = q.correct + q.wrong;
        const acc = total > 0 ? Math.round((q.correct / total) * 100) : 0;
        const level = acc < 40 ? '' : acc < 60 ? 'medium' : 'low';
        const badgeClass = acc < 40 ? '' : 'medium';
        const lessonNum = q.lessonId ? q.lessonId.replace('lesson-', 'שיעור ') : '';

        return `
          <div class="review-item ${level}">
            <div class="item-info">
              <div class="word">${q.prompt || '—'}</div>
              <div class="translation">${q.answer || '—'}</div>
              <div class="meta">
                <span class="lesson-chip">${lessonNum}</span>
                <span style="margin-right:8px">${q.wrong} טעויות / ${q.correct} נכון</span>
              </div>
            </div>
            <div class="item-badge ${badgeClass}">${acc}% דיוק</div>
          </div>`;
      }).join('');
    }

    function startReview() {
      const queue = CzechAppState.getReviewQueue();
      if (queue.length === 0) return;
      // בינתיים מעביר לשיעור הכי חלש
      const lessonId = queue[0].lessonId;
      window.location.href = `practice.html?lesson=${lessonId}&mode=review`;
    }

    init();
  </script>
</body>
</html>
