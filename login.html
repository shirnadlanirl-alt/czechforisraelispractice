<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>צ'כית IL – כניסה לתרגול</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5fb;
      color: #111827;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.12);
      padding: 24px 22px 20px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .auth-logo {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: #6b7280;
    }

    .tabs {
      display: flex;
      border-radius: 999px;
      background: #f3f4f6;
      padding: 4px;
      margin: 16px 0 20px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 14px;
      border-radius: 999px;
      cursor: pointer;
      color: #6b7280;
      border: none;
      background: transparent;
      transition: all 0.18s ease;
    }

    .tab.active {
      background: #111827;
      color: #f9fafb;
      font-weight: 600;
    }

    form {
      display: none;
      margin-top: 4px;
    }

    form.active {
      display: block;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #374151;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: #111827;
      box-shadow: 0 0 0 1px #11182710;
    }

    .forgot-row {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 14px;
    }

    .link {
      font-size: 13px;
      color: #2563eb;
      text-decoration: none;
      cursor: pointer;
    }

    .link:hover {
      text-decoration: underline;
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 9px 0;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: #111827;
      color: #f9fafb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .primary-btn:hover {
      background: #020617;
      transform: translateY(-1px);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }

    .error-msg,
    .success-msg {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      padding: 7px 8px;
      border-radius: 10px;
    }

    .error-msg {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .success-msg {
      background: #ecfdf3;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .footer-links {
      margin-top: 14px;
      font-size: 12px;
      text-align: center;
      color: #9ca3af;
    }

    .footer-links a {
      color: #6b7280;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-wrapper {
        border-radius: 0;
        max-width: 100%;
        height: 100vh;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-header">
      <div class="auth-logo">צ'כית IL</div>
      <div class="auth-subtitle">כניסה לאזור התרגול לתלמידים</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-target="login-form">התחברות</button>
      <button class="tab" data-target="signup-form">יצירת חשבון</button>
    </div>

    <!-- התחברות -->
    <form id="login-form" class="active">
      <div class="field">
        <label for="login-email">אימייל</label>
        <input type="email" id="login-email" autocomplete="email">
      </div>

      <div class="field">
        <label for="login-password">סיסמה</label>
        <input type="password" id="login-password" autocomplete="current-password">
      </div>

      <div class="forgot-row">
        <span id="forgot-password" class="link">שכחתי סיסמה</span>
      </div>

      <button type="submit" class="primary-btn">
        כניסה לתרגול
      </button>
    </form>

    <!-- הרשמה -->
    <form id="signup-form">
      <div class="field">
        <label for="signup-name">שם פרטי</label>
        <input type="text" id="signup-name" autocomplete="given-name">
      </div>

      <div class="field">
        <label for="signup-email">אימייל</label>
        <input type="email" id="signup-email" autocomplete="email">
      </div>

      <div class="field">
        <label for="signup-password">סיסמה</label>
        <input type="password" id="signup-password" autocomplete="new-password">
      </div>

      <button type="submit" class="primary-btn">
        יצירת חשבון חדש
      </button>

      <p class="hint">
        לאחר ההרשמה נשלח מייל אימות. יש לאשר את המייל לפני כניסה לתרגול.
      </p>
    </form>

    <div id="message" class="hint"></div>

    <div class="footer-links">
      <a href="https://www.czechforisraelis.cz/">חזרה לאתר הראשי</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      sendEmailVerification,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCl_xpEdc39WtbYF8Q9tEaOkNzuljWGn7s",
      authDomain: "czech-for-israelis.firebaseapp.com",
      projectId: "czech-for-israelis",
      storageBucket: "czech-for-israelis.firebasestorage.app",
      messagingSenderId: "482257983097",
      appId: "1:482257983097:web:0380098930acb2f68ee6a8",
      measurementId: "G-F8VYKQ1J80"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const tabs = document.querySelectorAll(".tab");
    const forms = {
      "login-form": document.getElementById("login-form"),
      "signup-form": document.getElementById("signup-form"),
    };
    const messageEl = document.getElementById("message");

    function showMessage(text, type = "hint") {
      if (!text) {
        messageEl.textContent = "";
        messageEl.className = "hint";
        return;
      }
      if (type === "error") {
        messageEl.textContent = text;
        messageEl.className = "error-msg";
      } else if (type === "success") {
        messageEl.textContent = text;
        messageEl.className = "success-msg";
      } else {
        messageEl.textContent = text;
        messageEl.className = "hint";
      }
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        const targetId = tab.getAttribute("data-target");
        Object.keys(forms).forEach(id => {
          forms[id].classList.toggle("active", id === targetId);
        });

        showMessage("");
      });
    });

    // דרישה: רק משתמשים עם אימייל מאומת יכולים להמשיך לאקדמיה
    onAuthStateChanged(auth, (user) => {
      if (user && user.emailVerified) {
        window.location.href = "index.html";
      }
    });

    // התחברות
    forms["login-form"].addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();

      if (!email || !password) {
        showMessage("נא למלא אימייל וסיסמה.", "error");
        return;
      }

      try {
        showMessage("מתחברת... רגע אחד.", "hint");
        const cred = await signInWithEmailAndPassword(auth, email, password);
        if (!cred.user.emailVerified) {
          showMessage("המייל לא אומת עדיין. בדקי את הדואר וודאי את הכתובת.", "error");
          // אופציונלי: להציע שליחה חוזרת
          return;
        }
        showMessage("התחברת בהצלחה, מעבירה למפת הקורס...", "success");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 600);
      } catch (err) {
        console.error(err);
        let msg = "לא הצלחנו להתחבר. נא לבדוק אימייל וסיסמה.";
        if (err.code === "auth/user-not-found") msg = "לא נמצא משתמש עם האימייל הזה.";
        if (err.code === "auth/wrong-password") msg = "הסיסמה אינה נכונה.";
        if (err.code === "auth/invalid-email") msg = "כתובת אימייל לא תקינה.";
        showMessage(msg, "error");
      }
    });

    // הרשמה עם שליחת מייל אימות
    forms["signup-form"].addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("signup-name").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value.trim();

      if (!name || !email || !password) {
        showMessage("נא למלא שם, אימייל וסיסמה.", "error");
        return;
      }

      if (password.length < 6) {
        showMessage("הסיסמה חייבת להיות באורך של 6 תווים לפחות.", "error");
        return;
      }

      try {
        showMessage("יוצרת חשבון... רגע אחד.", "hint");
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });

        // שליחת מייל אימות
        await sendEmailVerification(cred.user);
        showMessage("החשבון נוצר! נשלח מייל אימות. נא לאשר את הכתובת ואז להתחבר.", "success");

        // אחרי הרשמה – לא נכניס מיד לאקדמיה, נבקש שיאשרו קודם
        // אפשר גם להחליף אוטומטית לטאב "התחברות"
        tabs.forEach(t => t.classList.remove("active"));
        forms["signup-form"].classList.remove("active");
        forms["login-form"].classList.add("active");
        tabs[0].classList.add("active");
      } catch (err) {
        console.error(err);
        let msg = "לא הצלחנו ליצור חשבון. נסי אימייל אחר.";
        if (err.code === "auth/email-already-in-use") msg = "כבר קיים חשבון עם האימייל הזה.";
        if (err.code === "auth/invalid-email") msg = "כתובת אימייל לא תקינה.";
        showMessage(msg, "error");
      }
    });

    // שכחתי סיסמה
    document.getElementById("forgot-password").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value.trim();
      if (!email) {
        showMessage("נא למלא את האימייל ואז ללחוץ על \"שכחתי סיסמה\".", "error");
        return;
      }

      try {
        showMessage("שולחת מייל לאיפוס סיסמה...", "hint");
        await sendPasswordResetEmail(auth, email);
        showMessage("נשלח מייל לאיפוס סיסמה (אם האימייל קיים במערכת).", "success");
      } catch (err) {
        console.error(err);
        let msg = "לא הצלחנו לשלוח מייל לאיפוס.";
        if (err.code === "auth/invalid-email") msg = "כתובת אימייל לא תקינה.";
        showMessage(msg, "error");
      }
    });
  </script>
</body>
</html>
